name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS (SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: macos
        run: |
          xcodebuild -project Bromelia.xcodeproj -scheme Bromelia -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData test

  windows:
    name: Windows (WinUI 3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        working-directory: windows
        run: dotnet test tests/Bromelia.Core.Tests/Bromelia.Core.Tests.csproj
      # The WinUI app is built with Visual Studio's MSBuild, not `dotnet build`: Windows App SDK 1.6
      # loads its PRI tasks (Microsoft.Build.Packaging.Pri.Tasks.dll) from Visual Studio's
      # MSBuild\Microsoft\VisualStudio\v<version>\AppxPackage folder, which the .NET SDK does not ship.
      - uses: microsoft/setup-msbuild@v2
      - name: Build app (x64)
        working-directory: windows
        run: msbuild src/Bromelia.App/Bromelia.App.csproj -restore -m -p:Configuration=Release -p:Platform=x64
      - name: Publish app (x64, self-contained)
        working-directory: windows
        run: >-
          msbuild src/Bromelia.App/Bromelia.App.csproj -restore -m -t:Publish -p:Configuration=Release -p:Platform=x64
          -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishDir=${{ github.workspace }}/windows/publish/
      - uses: actions/upload-artifact@v4
        with:
          name: Bromelia-windows-x64
          path: windows/publish
      # Every page as a PNG (Snapshots.cs), with a stand-in for makemkvcon that lists the fixture's drives.
      - name: Screenshots
        shell: pwsh
        run: |
          $data = "$env:RUNNER_TEMP\bromelia-data"; $fake = "$env:RUNNER_TEMP\fake-makemkvcon"; $shots = "$env:GITHUB_WORKSPACE\windows-screenshots"
          New-Item -ItemType Directory -Force $data, $fake, $shots | Out-Null
          Copy-Item shared\fixtures\drive-scan.txt $fake
          Get-Content shared\fixtures\info-dvd.txt | Where-Object { $_ -notmatch '^DRV:' } | Set-Content $fake\listing.txt
          Set-Content $fake\makemkvcon.cmd "@echo off`r`necho %* | findstr /c:`"disc:9999`" >nul && (type `"%~dp0drive-scan.txt`" & exit /b 0)`r`ntype `"%~dp0listing.txt`"`r`nexit /b 0"
          @{ version = 2; makemkvconPath = "$fake\makemkvcon.cmd"; outputRoot = "$env:RUNNER_TEMP\rips"; pollIntervalSeconds = 0; preventSleep = $false } |
            ConvertTo-Json | Set-Content $data\config.json
          $env:BROMELIA_DATA_DIR = $data; $env:BROMELIA_SNAPSHOT = $shots
          $p = Start-Process windows\publish\Bromelia.exe -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "The app did not finish its screenshots in 5 minutes" }
          $n = (Get-ChildItem $shots -Filter *.png).Count
          "Exit code $($p.ExitCode); $n screenshots"
          if ((Test-Path $shots\errors.txt) -or $n -lt 20) {
            if (Test-Path $shots\errors.txt) { Get-Content $shots\errors.txt }
            Get-WinEvent -LogName Application -MaxEvents 30 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } | Format-List TimeCreated, ProviderName, Message
            throw "Screenshot mode failed"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: windows-screenshots

  linux:
    name: Linux (GTK 4 / libadwaita)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtk-4-dev libadwaita-1-dev libjson-glib-dev glib-networking openssl
      - name: Build
        working-directory: linux
        run: |
          meson setup builddir
          ninja -C builddir
      - name: Test
        working-directory: linux
        run: meson test -C builddir --print-errorlogs
      - name: Build headless (bromelia-daemon, no GTK)
        working-directory: linux
        run: |
          meson setup build-headless -Dui=false
          ninja -C build-headless
          ./build-headless/src/bromelia-daemon --version
      # The web page in a real browser, against the daemon and a stand-in for makemkvcon.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Web page in Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55
          npx playwright install --with-deps chromium
          node shared/web/test/check-web-page.mjs linux/build-headless/src/bromelia-daemon web-page-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-page-screenshots
          path: web-page-screenshots

  docker:
    name: Docker image (bromelia-daemon + MakeMKV)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # MakeMKV's binary part is under its own EULA; the owner accepts it for these builds (docs/docker.md).
      - name: Build image
        run: docker build -f docker/Dockerfile --build-arg ACCEPT_MAKEMKV_EULA=yes -t bromelia .
      - name: Smoke test
        run: docker/smoke-test.sh bromelia
