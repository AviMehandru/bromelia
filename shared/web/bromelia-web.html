<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bromelia</title>
<style>
  :root { --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e0; --accent: #2f7d5b;
          --ok: #2f7d5b; --warn: #b26b00; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161617; --card: #1f1f21; --text: #f2f2f2; --muted: #9a9aa0; --line: #333336; --accent: #5cc493;
            --ok: #5cc493; --warn: #e0a040; --bad: #ef6b5c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header span { color: var(--muted); font-size: 13px; }
  main { padding: 0 16px 24px; max-width: 980px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 180px; }
  .muted { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .state { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .success { color: var(--ok); } .errors, .waiting { color: var(--warn); } .failed { color: var(--bad); } .cancelled, .queued { color: var(--muted); }
  .running { color: var(--accent); }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .banner { background: var(--card); border: 1px solid var(--warn); color: var(--text); border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }
  #error { color: var(--bad); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<header><h1>Bromelia</h1><span id="meta"></span></header>
<main>
  <div id="error"></div>
  <div id="problem"></div>
  <h2>Drives</h2><div id="drives"></div>
  <h2>Jobs</h2><div id="jobs"></div>
  <h2>Background</h2><div id="background"></div>
  <h2>Recent</h2><div id="history"></div>
  <h2>Archive check</h2><div id="verify"></div>
</main>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const headers = token ? { "Authorization": "Bearer " + token } : {};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// The last action's error stays until the next action (the refresh after it would otherwise clear it at once).
let actionError = "";
async function call(path) {
  try {
    const r = await fetch(path, { method: "POST", headers: { ...headers, "X-Bromelia": "1" } });
    actionError = r.ok ? "" : (await r.text()) || ("HTTP " + r.status);
  } catch (e) {
    actionError = "Bromelia is not reachable: " + e.message;
  }
  refresh();
}
const button = (label, path) => { const b = el("button", null, label); b.onclick = () => call(path); return b; };

function render(s) {
  document.getElementById("meta").textContent = [s.makemkv, s.version && "Bromelia " + s.version].filter(Boolean).join(" · ");
  const problem = document.getElementById("problem");
  problem.replaceChildren();
  if (s.problem) problem.append(el("div", "banner", s.problem));

  const drives = document.getElementById("drives");
  drives.replaceChildren();
  if (!s.drives.length) drives.append(el("div", "empty", "No drives found."));
  for (const d of s.drives) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    t.append(el("div", null, d.name), el("div", "muted", [d.state, d.disc, d.device].filter(Boolean).join(" · ")));
    r.append(t);
    const lane = encodeURIComponent(d.lane);
    if (d.hasDisc && !d.busy) r.append(button("Rip", `/api/drives/${lane}/rip`));
    if (d.hasDisc && !d.busy) r.append(button("Eject", `/api/drives/${lane}/eject`));
    if (!d.hasDisc) r.append(button("Close tray", `/api/drives/${lane}/close`));
    c.append(r);
    drives.append(c);
  }

  const jobs = document.getElementById("jobs");
  jobs.replaceChildren();
  const live = s.jobs.filter(j => ["running", "queued", "waiting"].includes(j.state));
  if (!live.length) jobs.append(el("div", "empty", "Nothing running."));
  for (const j of live) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    t.append(el("div", null, j.title), el("div", "muted", j.phase || ""));
    r.append(t, el("span", "state " + j.state, j.stateLabel));
    if (j.state !== "done") r.append(button("Cancel", `/api/jobs/${encodeURIComponent(j.id)}/cancel`));
    c.append(r);
    if (j.state === "running") { const p = el("progress"); p.max = 1; p.value = j.progress || 0; c.append(p); }
    jobs.append(c);
  }

  const bg = document.getElementById("background");
  bg.replaceChildren();
  if (!s.background.length) bg.append(el("div", "empty", "No background steps."));
  for (const b of s.background) {
    const c = el("div", "card"), r = el("div", "row");
    r.append(el("div", "grow", b.title), el("span", "state " + b.state, b.state));
    c.append(r);
    bg.append(c);
  }

  const history = document.getElementById("history");
  history.replaceChildren();
  const done = s.jobs.filter(j => !["running", "queued", "waiting"].includes(j.state)).concat(s.history).slice(0, 20);
  if (!done.length) history.append(el("div", "empty", "No finished jobs yet."));
  for (const h of done) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    t.append(el("div", null, h.title), el("div", "muted", h.error || h.outputDirectory || ""));
    r.append(t, el("span", "state " + h.state, h.stateLabel || h.state));
    c.append(r);
    history.append(c);
  }

  // Re-reading the output folder's archives against their SHA256SUMS (older Bromelia versions have no "verify").
  const verify = document.getElementById("verify");
  verify.replaceChildren();
  const v = s.verify;
  if (v) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    if (v.running) {
      t.append(el("div", null, "Checking " + (v.folder || v.path)), el("div", "muted", Math.round((v.progress || 0) * 100) + " %"));
      r.append(t, button("Stop", "/api/verify/cancel"));
      c.append(r);
      const p = el("progress"); p.max = 1; p.value = v.progress || 0; c.append(p);
    } else {
      const when = v.finishedAt ? new Date(v.finishedAt).toLocaleString() : "";
      const damaged = v.damaged || [];
      t.append(el("div", null, !when ? "Not checked since Bromelia started." :
        `${when}${v.stopped ? " (stopped)" : ""}: ${v.folders} folder(s), ${damaged.length ? damaged.length + " damaged" : "all OK"}`));
      for (const d of damaged) t.append(el("div", "muted", d.folder + ": " + d.summary));
      r.append(t, button("Check output folder", "/api/verify"));
      c.append(r);
    }
    verify.append(c);
  }
}

async function refresh() {
  try {
    const r = await fetch("/api/status", { headers });
    if (!r.ok) throw new Error(r.status === 401 ? "Add ?token=… to the address." : (await r.text()) || "HTTP " + r.status);
    render(await r.json());
    document.getElementById("error").textContent = actionError;
  } catch (e) {
    document.getElementById("error").textContent = "Bromelia is not reachable: " + e.message;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
