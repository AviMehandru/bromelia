<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bromelia</title>
<style>
  :root { --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e2e2e0; --accent: #2f7d5b;
          --ok: #2f7d5b; --warn: #b26b00; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161617; --card: #1f1f21; --text: #f2f2f2; --muted: #9a9aa0; --line: #333336; --accent: #5cc493;
            --ok: #5cc493; --warn: #e0a040; --bad: #ef6b5c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 16px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header span { color: var(--muted); font-size: 13px; }
  main { padding: 0 16px 24px; max-width: 980px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 20px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 180px; }
  .muted { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .state { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .success { color: var(--ok); } .errors, .waiting { color: var(--warn); } .failed { color: var(--bad); } .cancelled, .queued { color: var(--muted); }
  .running { color: var(--accent); }
  button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; border-color: var(--line); }
  progress { width: 100%; height: 8px; accent-color: var(--accent); }
  .banner { background: var(--card); border: 1px solid var(--warn); color: var(--text); border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 2px; }
  #error { color: var(--bad); font-size: 13px; min-height: 1em; }
  .titles { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  .titles label { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 14px; cursor: pointer; }
  .titles label span { color: var(--muted); font-size: 13px; }
  .details { margin-top: 8px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  pre.log { margin: 8px 0 0; max-height: 320px; overflow: auto; font: 12px/1.35 ui-monospace, "Cascadia Mono", Menlo, monospace;
            white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px; }
  .clickable { cursor: pointer; }
  select { font: inherit; font-size: 13px; padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 100%; }
</style>
</head>
<body>
<header><h1>Bromelia</h1><span id="meta"></span></header>
<main>
  <div id="error"></div>
  <div id="problem"></div>
  <h2>Drives</h2><div id="drives"></div>
  <h2>Jobs</h2><div id="jobs"></div>
  <h2>Background</h2><div id="background"></div>
  <h2>Recent</h2><div id="history"></div>
  <h2>Archive check</h2><div id="verify"></div>
  <h2>Settings</h2><div id="settings"></div>
</main>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const headers = token ? { "Authorization": "Bearer " + token } : {};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// The last action's error stays until the next action (the refresh after it would otherwise clear it at once).
let actionError = "";
async function call(path) {
  try {
    const r = await fetch(path, { method: "POST", headers: { ...headers, "X-Bromelia": "1" } });
    actionError = r.ok ? "" : (await r.text()) || ("HTTP " + r.status);
  } catch (e) {
    actionError = "Bromelia is not reachable: " + e.message;
  }
  refresh();
}
const button = (label, path) => { const b = el("button", null, label); b.onclick = () => call(path); return b; };

function render(s) {
  document.getElementById("meta").textContent = [s.makemkv, s.version && "Bromelia " + s.version].filter(Boolean).join(" · ");
  const problem = document.getElementById("problem");
  problem.replaceChildren();
  if (s.problem) problem.append(el("div", "banner", s.problem));

  const drives = document.getElementById("drives");
  drives.replaceChildren();
  if (!s.drives.length) drives.append(el("div", "empty", "No drives found."));
  for (const d of s.drives) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    t.append(el("div", null, d.name), el("div", "muted", [d.state, d.disc, d.device].filter(Boolean).join(" · ")));
    r.append(t);
    const lane = encodeURIComponent(d.lane);
    if (d.hasDisc && !d.busy) r.append(button("Open", `/api/drives/${lane}/open`));
    if (d.hasDisc && !d.busy) r.append(button("Rip", `/api/drives/${lane}/rip`));
    if (d.hasDisc && !d.busy) r.append(button("Eject", `/api/drives/${lane}/eject`));
    if (!d.hasDisc) r.append(button("Close tray", `/api/drives/${lane}/close`));
    c.append(r);
    if (d.opened && d.hasDisc) c.append(titleList(d, lane));
    drives.append(c);
  }

  const jobs = document.getElementById("jobs");
  jobs.replaceChildren();
  const live = s.jobs.filter(j => ["running", "queued", "waiting"].includes(j.state));
  if (!live.length) jobs.append(el("div", "empty", "Nothing running."));
  for (const j of live) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    t.append(el("div", null, j.title), el("div", "muted", j.phase || ""));
    r.append(t, el("span", "state " + j.state, j.stateLabel), logButton(j.id));
    if (j.state !== "done") r.append(button("Cancel", `/api/jobs/${encodeURIComponent(j.id)}/cancel`));
    c.append(r);
    if (j.state === "running") { const p = el("progress"); p.max = 1; p.value = j.progress || 0; c.append(p); }
    addLog(c, j.id, j.state === "running");
    jobs.append(c);
  }

  const bg = document.getElementById("background");
  bg.replaceChildren();
  if (!s.background.length) bg.append(el("div", "empty", "No background steps."));
  for (const b of s.background) {
    const c = el("div", "card"), r = el("div", "row");
    r.append(el("div", "grow", b.title), el("span", "state " + b.state, b.state));
    c.append(r);
    bg.append(c);
  }

  const history = document.getElementById("history");
  history.replaceChildren();
  // A finished job is also in the history (by the same id) once it has been recorded: show it once.
  const finished = s.jobs.filter(j => !["running", "queued", "waiting"].includes(j.state));
  const shown = new Set(finished.map(j => j.id));
  const done = finished.concat(s.history.filter(h => !h.id || !shown.has(h.id))).slice(0, 20);
  if (!done.length) history.append(el("div", "empty", "No finished jobs yet."));
  for (const h of done) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow clickable");
    t.append(el("div", null, h.title), el("div", "muted", h.error || h.outputDirectory || ""));
    t.title = "Show the details";
    t.onclick = () => { if (expanded.has(h.id)) expanded.delete(h.id); else expanded.add(h.id); render(last); };
    r.append(t, el("span", "state " + h.state, h.stateLabel || h.state));
    if (h.id) r.append(logButton(h.id));
    c.append(r);
    if (h.id && expanded.has(h.id)) c.append(details(h));
    if (h.id) addLog(c, h.id, false);
    history.append(c);
  }

  // Re-reading the output folder's archives against their SHA256SUMS (older Bromelia versions have no "verify").
  const verify = document.getElementById("verify");
  verify.replaceChildren();
  const v = s.verify;
  if (v) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    if (v.running) {
      t.append(el("div", null, "Checking " + (v.folder || v.path)), el("div", "muted", Math.round((v.progress || 0) * 100) + " %"));
      r.append(t, button("Stop", "/api/verify/cancel"));
      c.append(r);
      const p = el("progress"); p.max = 1; p.value = v.progress || 0; c.append(p);
    } else {
      const when = v.finishedAt ? new Date(v.finishedAt).toLocaleString() : "";
      const damaged = v.damaged || [];
      t.append(el("div", null, !when ? "Not checked since Bromelia started." :
        `${when}${v.stopped ? " (stopped)" : ""}: ${v.folders} folder(s), ${damaged.length ? damaged.length + " damaged" : "all OK"}`));
      for (const d of damaged) t.append(el("div", "muted", d.folder + ": " + d.summary));
      r.append(t, button("Check output folder", "/api/verify"));
      c.append(r);
    }
    verify.append(c);
  }
  renderSettings(s.settings);
}

// --- Opened discs: the titles, picked like on the disc page (the drive's rules preselect them). ---
const picked = {};   // lane → { disc, titles: Set of title numbers }
function titleList(d, lane) {
  const box = el("div", "titles"), o = d.opened;
  if (o.loading) { box.append(el("div", "muted", "Reading the disc…")); return box; }
  if (o.error) { box.append(el("div", "muted", o.error)); return box; }
  const titles = o.titles || [];
  let p = picked[d.lane];
  if (!p || p.disc !== o.name) p = picked[d.lane] = { disc: o.name, titles: new Set(titles.filter(x => x.selected).map(x => x.index)) };
  for (const x of titles) {
    const l = el("label"), cb = el("input");
    cb.type = "checkbox";
    cb.checked = p.titles.has(x.index);
    cb.onchange = () => { if (cb.checked) p.titles.add(x.index); else p.titles.delete(x.index); render(last); };
    l.append(cb, el("div", null, (x.name || "Title " + x.index)),
             el("span", null, [x.duration, x.chapters + " ch", size(x.size)].filter(Boolean).join(" · ")));
    box.append(l);
  }
  const chosen = titles.filter(x => p.titles.has(x.index)).map(x => x.index);
  const r = el("div", "row");
  r.append(el("div", "grow muted", `${chosen.length} of ${titles.length} title(s) · ${size(titles.filter(x => p.titles.has(x.index)).reduce((a, x) => a + (x.size || 0), 0))}`));
  const b = button(`Make MKV (${chosen.length} title${chosen.length === 1 ? "" : "s"})`, `/api/drives/${lane}/rip?titles=${chosen.join(",")}`);
  b.disabled = !chosen.length;
  r.append(b);
  box.append(r);
  return box;
}
function size(bytes) {
  if (!bytes) return "";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0, n = bytes;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}

// --- Job logs (running jobs are read again at every refresh) and history details. ---
const expanded = new Set(), logs = new Map();   // id → text shown, or "" while it is read
function logButton(id) {
  const b = el("button", null, logs.has(id) ? "Hide log" : "Log");
  b.onclick = () => { if (logs.has(id)) logs.delete(id); else { logs.set(id, ""); readLog(id); } render(last); };
  return b;
}
async function readLog(id) {
  try {
    const r = await fetch(`/api/jobs/${encodeURIComponent(id)}/log`, { headers });
    const text = r.ok ? await r.text() : "The log can't be read: " + ((await r.text()) || "HTTP " + r.status);
    if (logs.has(id)) { logs.set(id, text || "(empty)"); render(last); }
  } catch (e) { if (logs.has(id)) { logs.set(id, "The log can't be read: " + e.message); render(last); } }
}
function addLog(card, id, live) {
  if (!logs.has(id)) return;
  const pre = el("pre", "log", logs.get(id) || "Reading the log…");
  card.append(pre);
  requestAnimationFrame(() => { pre.scrollTop = pre.scrollHeight; });
  if (live) pending.add(id);
}
const pending = new Set();
function details(h) {
  const box = el("div", "details");
  const when = t => t ? new Date(t).toLocaleString() : "";
  box.append(el("div", null, [h.mode, h.drive].filter(Boolean).join(" · ")));
  if (h.startedAt || h.finishedAt) box.append(el("div", null, [when(h.startedAt), when(h.finishedAt)].filter(Boolean).join(" → ")));
  box.append(el("div", null, `${h.files || 0} file(s) · ${h.warnings || 0} warning(s) · ${h.errors || 0} error(s)`));
  if (h.outputDirectory) box.append(el("div", null, h.outputDirectory));
  if (h.error) box.append(el("div", null, h.error));
  return box;
}

// --- Settings: automatic rips and the mode of each drive configuration. Drawn again only when they change, so an
// open menu isn't closed by the refresh. ---
let settingsShown = "";
function renderSettings(st) {
  const box = document.getElementById("settings"), key = JSON.stringify(st || null);
  if (key === settingsShown) return;
  settingsShown = key;
  box.replaceChildren();
  if (!st || !st.drives || !st.drives.length) { box.append(el("div", "empty", "No settings to change here.")); return; }
  for (const d of st.drives) {
    const c = el("div", "card"), r = el("div", "row"), t = el("div", "grow");
    t.append(el("div", null, d.name), el("div", "muted", d.isDefault ? "Drives without their own configuration" : "Drive configuration"));
    const auto = el("label", "muted"), cb = el("input");
    cb.type = "checkbox";
    cb.checked = !!d.autoRip;
    cb.onchange = () => call(`/api/settings/${encodeURIComponent(d.id)}/set?autoRip=${cb.checked ? 1 : 0}`);
    auto.append(cb, " Rip when a disc is inserted");
    const mode = el("select");
    for (const m of st.modes || []) { const o = el("option", null, m.label); o.value = m.value; o.selected = m.value === d.mode; mode.append(o); }
    mode.onchange = () => call(`/api/settings/${encodeURIComponent(d.id)}/set?mode=${encodeURIComponent(mode.value)}`);
    r.append(t, auto, mode);
    c.append(r);
    box.append(c);
  }
}

let last = null;
async function refresh() {
  try {
    const r = await fetch("/api/status", { headers });
    if (!r.ok) throw new Error(r.status === 401 ? "Add ?token=… to the address." : (await r.text()) || "HTTP " + r.status);
    last = await r.json();
    pending.clear();
    render(last);
    for (const id of pending) readLog(id);
    document.getElementById("error").textContent = actionError;
  } catch (e) {
    document.getElementById("error").textContent = "Bromelia is not reachable: " + e.message;
  }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
