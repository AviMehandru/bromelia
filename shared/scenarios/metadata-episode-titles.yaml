title: A TV disc's episodes get their titles from the show's season and they appear in the names and the record
from:
  - docs/configuration.md#online-lookup (episode titles)
  - macos LookupTests.episodeTitlesInNames
given:
  disc: {volume: FRIENDS_S2_D1, type: dvd, titles: [{duration: "0:22:00", source: 1}, {duration: "0:22:30", source: 2}, {duration: "0:21:40", source: 3}]}
  profile: {naming: {layout: mediaServer}}
  configPatch: {metadata: {provider: tmdb, apiKey: {secret: metadata.apiKey}, nfo: false}}
  http:
    - {method: GET, url: "https://api.themoviedb.org/3/search/tv?*", status: 200, file: tmdb-search-tv.json}
    - {method: GET, url: "https://api.themoviedb.org/3/tv/1668/season/2?*", status: 200, file: tmdb-season.json}
steps:
  - rip: {iso: true, as: job}
  - expect:
      job: {name: job, outcome: succeeded}
      files:
        under: "library/TV Shows/Friends (1994)"
        include:
          - "Season 02/Friends (1994) - S02E01 - The One with Ross's New Girlfriend.mkv"
          - "Season 02/Friends (1994) - S02E02 - The One with the Breast Milk.mkv"
          - "Season 02/Friends (1994) - S02E03 - The One Where Heckles Dies.mkv"
      log: {job: job, include: [metadata.episodeTitles]}
