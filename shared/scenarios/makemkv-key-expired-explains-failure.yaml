title: An expired key is named as the cause of the failure and raises a problem with the beta-key action
from:
  - macos OnePassJobTests.expiredKeyExplainsTheFailure
  - docs/configuration.md (MakeMKV messages shown outside the log)
given:
  disc: sample-movie-one-title
  tools: {makemkvcon: tools/makemkvcon-key-expired.yaml}
steps:
  - rip: {iso: true, as: job}
  - expect:
      job: {name: job, outcome: failed, error: {code: makemkv.keyExpired}, errorText: "key has expired"}
      problems: {active: [makemkv.keyExpired]}
