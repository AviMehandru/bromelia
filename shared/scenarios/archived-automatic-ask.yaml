title: With alreadyArchived ask, an automatic rip of an archived disc waits for an answer, leaving the disc in the drive
from:
  - macos ArchiveCheckTests.discsArchivedBefore
  - docs/configuration.md#archive-check
  - rearchitecture-plan §20.1 (Decide)
given:
  drives:
    - {id: drive, name: Test drive, identification: "BD-RE TEST DRIVE 1.00 SN1", device: /dev/test0, disc: sample-movie-one-title}
  configPatch: {automation: {defaults: {alreadyArchived: ask, ejectWhenDone: true}}}
steps:
  - rip: {drive: drive, as: first}
  - rip: {drive: drive, automatic: true, as: asked}
  - expect:
      job: {name: asked, state: awaitingDecision, decision: {question: {code: decision.archivedBefore}}}
      calls: {makemkvcon: {counts: {" mkv ": 1}}}
  - decide: {job: asked, answer: ripAgain}
  - expect:
      job: {name: asked, outcome: succeeded}
      calls: {makemkvcon: {counts: {" mkv ": 2}}}
  - rip: {drive: drive, automatic: true, as: skipped}
  - decide: {job: skipped, answer: skip}
  - expect:
      job: {name: skipped, outcome: skipped, error: {code: disc.alreadyArchivedAsk}}
