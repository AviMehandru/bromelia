tool: makemkvcon
note: Asked for an ISO, MakeMKV writes a folder backup instead.
rules:
  - when: {command: info}
    print: [listing]
  - when: {command: backup}
    writeFolder: {"BDMV/index.bdmv": "x"}
    print: [saved]
  - when: {command: mkv}
    writeTitles: {content: "mkv data {title}"}
    print: [saved]
