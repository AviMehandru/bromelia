title: Drives rip in parallel, one job per drive; limits.acquisitions caps rips across drives; the queue can be reordered and started now
phase: 3
from:
  - README.md (parallel rips, one job per drive at a time, optional global limit, queue reorder, cancel, retry, start now)
  - docs/configuration.md#top-level (maxConcurrentJobs)
  - rearchitecture-plan §21
  - "owner H5-1 (2026-11-01): first reaches Acquire before the other rips, so which job gets the one slot isn't a race"
given:
  configPatch: {limits: {acquisitions: 1}}
  drives:
    - {id: a, identification: "BD-RE A 1.00", device: /dev/a, disc: sample-movie-one-title}
    - {id: b, identification: "BD-RE B 1.00", device: /dev/b, disc: sample-movie-one-title}
    - {id: c, identification: "BD-RE C 1.00", device: /dev/c, disc: sample-movie-one-title}
  tools: {makemkvcon: tools/makemkvcon-stalls.yaml}
steps:
  - rip: {drive: a, as: first}
  - wait: {job: first, step: acquire}
  - rip: {drive: b, as: second}
  - rip: {drive: c, as: third}
  - wait: {job: second, state: waitingForResources}
  - expect:
      when: {job: third, state: waitingForResources}
      job: {name: first, state: running}
  - move: {job: third, by: -1}
  - cancel: first
  - expect:
      when: {job: third, step: acquire}
      job: {name: second, state: waitingForResources}
