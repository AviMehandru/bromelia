title: "Recorded makemkvcon run rip-failure: exit 0, no file written → failed"
from:
  - shared/fixtures/rip-outcomes.json
  - macos RecordedRunTests.everyRecordedRunEndsAsExpected
  - docs/architecture.md#stopping-processes
given:
  disc: sample-movie
  tools: {makemkvcon: tools/makemkvcon-recorded-rip-failure.yaml}
steps:
  - rip: {iso: true, titles: [0], as: job}
  - expect:
      job: {name: job, outcome: failed, errorText: "MEDIUM ERROR"}
      files: {under: library, exactly: []}
