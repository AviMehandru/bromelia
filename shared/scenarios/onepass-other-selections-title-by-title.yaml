title: A selection that leaves out a longer title is ripped title by title
from:
  - macos OnePassJobTests.otherSelectionsAreRippedTitleByTitle
given:
  disc: {volume: SAMPLE_MOVIE, type: bluray, titles: [{duration: "0:00:30", source: 1}, {duration: "0:00:05", source: 2}, {duration: "0:00:20", source: 3}, {duration: "0:00:40", source: 4}, {duration: "0:00:10", source: 5}]}
  profile: {titles: {strategy: indices, indexPattern: "0,1,3"}}
steps:
  - rip: {iso: true, as: job}
  - expect:
      job: {name: job, outcome: succeeded}
      calls: {makemkvcon: {counts: {" mkv ": 3}, exclude: ["--minlength"]}}
