title: The INCOMPLETE note of a failed job set aside at the next start names the logs next to it, and makemkv's log has everything it printed
from:
  - macos SafetyTests.failureInASharedFolderUsesASubfolder
  - docs/configuration.md#archive-files
  - owner decision 2026-10-25 (a failed job's staging stays hidden for a retry; keep-apart or the next start moves it to _Quarantine)
given:
  disc: sample-movie-one-title
  tools: {makemkvcon: tools/makemkvcon-fails-file-written.yaml}
steps:
  - rip: {iso: true, titles: [0], as: job}
  - expect:
      job: {name: job, outcome: failed}
      files: {under: library, include: [".bromelia/staging/{jobId}/title_t00.mkv"], exclude: ["_Quarantine"]}
  - restart: {}
  - expect:
      file:
        path: "library/_Quarantine/Sample Movie [INCOMPLETE]/INCOMPLETE.txt"
        contains: ["NOT a finished archive", "bromelia-{unit8}-log.txt", "makemkv-{unit8}-log.txt"]
      transcript: {job: job, contains: ["Failed to save title 1 to file title_t01.mkv"]}
