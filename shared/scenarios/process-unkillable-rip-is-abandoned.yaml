title: A makemkvcon that doesn't end even after SIGKILL is abandoned 30 s later, so the job can end; its files are kept apart only after a restart
phase: 3
from:
  - docs/architecture.md#stopping-processes
  - docs/configuration.md#output-folder-read-errors-and-checks
  - owner decision 2026-10-25 (a job whose MakeMKV was left behind is kept apart only after a restart)
given:
  disc: sample-movie-one-title
  configPatch: {limits: {stallTimeoutMinutes: 1}}
  tools: {makemkvcon: tools/makemkvcon-stalls-unkillable.yaml}
steps:
  - rip: {iso: true, titles: [0], as: job}
  - advance: 100
  - expect:
      job: {name: job, outcome: failed, error: {code: makemkv.stalled, params: {abandoned: true}}}
      log: {job: job, include: [process.abandoned]}
  - restart: {}
  - keepApart: job
  - expect:
      job: {name: job, outcome: cancelled}
